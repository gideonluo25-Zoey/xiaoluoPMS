<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小罗项目管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Noto Sans SC"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              cyan: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9', // Primary Brand Color
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
                950: '#082f49',
              },
              tech: {
                dark: '#f0f9ff', // Sky 50 (Light Background)
                surface: '#ffffff', // White Surface
                primary: '#0ea5e9', // Sky 500
                secondary: '#38bdf8', // Sky 400
                accent: '#6366f1', // Indigo 500
                text: '#0f172a', // Slate 900 (Dark Text)
                dim: '#64748b', // Slate 500
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              glow: {
                '0%': { boxShadow: '0 0 5px #38bdf8' },
                '100%': { boxShadow: '0 0 20px #38bdf8, 0 0 10px #60a5fa' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #f0f9ff; /* Sky 50 - Light Blue Background */
        color: #0f172a;
        overflow-x: hidden;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f0f9ff;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7); /* White Glass */
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(186, 230, 253, 0.6); /* Sky 200 Border */
        box-shadow: 0 4px 20px rgba(14, 165, 233, 0.08); /* Soft Blue Shadow */
      }
      .input-tech {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #cbd5e1; /* Slate 300 */
        color: #0f172a;
        transition: all 0.3s ease;
      }
      .input-tech:focus {
        border-color: #0ea5e9; /* Sky 500 */
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        outline: none;
      }
      .input-tech::placeholder {
        color: #94a3b8;
      }
      .custom-scrollbar::-webkit-scrollbar {
        height: 6px;
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
